services:
  gql-gateway:
    image: ghcr.io/themulle/gql:getting-started
    container_name: gql-gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Integrierter Microsoft Garnet .NET L2-Cache
      - Gateway__Caching__Garnet__EnableEmbeddedServer=true
    restart: unless-stopped
